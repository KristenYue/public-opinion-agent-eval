name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-release-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[demo,training,production,shadow,dev]"

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run regression tests
        run: python -m pytest -q -m "not integration"

      - name: Run frozen RAG quality and injection gate
        run: python scripts/evaluate_rag_v1.py

      - name: Run security governance fault-injection gate
        run: python scripts/evaluate_security_governance.py

      - name: Run paired Runtime regression gate
        run: python scripts/evaluate_runtime_gate.py

      - name: Run release-readiness checks
        run: python scripts/check_release_readiness.py

      - name: Build and inspect wheel
        run: |
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir wheelhouse
          python scripts/check_wheel_contents.py wheelhouse/*.whl
          python -m pip install --force-reinstall --no-deps wheelhouse/*.whl
          cd /tmp
          python -c "from importlib.resources import files; from opinion_agent.api import app; assert app.title; assert files('opinion_agent').joinpath('static/index.html').is_file()"

  postgres-redis-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opinion_agent
          POSTGRES_USER: opinion_agent
          POSTGRES_PASSWORD: integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opinion_agent -d opinion_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://opinion_agent:integration-only@localhost:5432/opinion_agent
      REDIS_URL: redis://localhost:6379/0
      V2_PROJECT_ID: 11111111-1111-1111-1111-111111111111

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install production test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[production,shadow,dev]"

      - name: Apply schema and bootstrap project
        run: |
          python scripts/apply_v2_migrations.py
          python scripts/bootstrap_v2_project.py

      - name: Exercise PostgreSQL and Redis lifecycle
        run: python -m pytest -q tests/integration -m integration

  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      POSTGRES_PASSWORD: compose-smoke-only
      GRAFANA_ADMIN_PASSWORD: compose-smoke-only
      IMAGE_TAG: ci-${{ github.sha }}
      API_PORT: 18000
      PROMETHEUS_PORT: 19090
      GRAFANA_PORT: 13000
      API_BASE_URL: http://127.0.0.1:18000
      PROMETHEUS_BASE_URL: http://127.0.0.1:19090
      GRAFANA_BASE_URL: http://127.0.0.1:13000

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start complete Compose stack
        run: docker compose up --detach --build

      - name: Exercise public V2 lifecycle and observability
        run: python scripts/smoke_v2_compose.py

      - name: Show Compose status and logs
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color

      - name: Remove ephemeral CI services and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
