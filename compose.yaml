name: opinion-agent-v2

x-runtime-environment: &runtime-environment
  DATABASE_URL: postgresql://opinion_agent:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/opinion_agent
  REDIS_URL: redis://redis:6379/0
  ARQ_QUEUE_NAME: opinion-agent
  JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
  JOB_RETRY_DELAY_SECONDS: ${JOB_RETRY_DELAY_SECONDS:-5}
  JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-60}
  JOB_HEARTBEAT_INTERVAL_SECONDS: ${JOB_HEARTBEAT_INTERVAL_SECONDS:-20}
  RUNTIME_SHADOW_ENABLED: ${RUNTIME_SHADOW_ENABLED:-false}
  RUNTIME_SHADOW_CANDIDATE: ${RUNTIME_SHADOW_CANDIDATE:-agent-runtime-quality-platform@0.6.0.dev0}
  RUNTIME_SHADOW_TIMEOUT_SECONDS: ${RUNTIME_SHADOW_TIMEOUT_SECONDS:-120}
  RUNTIME_SHADOW_LEASE_SECONDS: ${RUNTIME_SHADOW_LEASE_SECONDS:-60}
  RUNTIME_SHADOW_CHECKPOINT_PATH: ${RUNTIME_SHADOW_CHECKPOINT_PATH:-/tmp/opinion-agent-shadow/runtime.sqlite3}
  SENTIMENT_BACKEND: ${SENTIMENT_BACKEND:-legacy_xgboost}
  RETRIEVER_BACKEND: ${RETRIEVER_BACKEND:-tfidf}
  RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE:-0.04}
  MAX_REQUEST_CHARS: ${MAX_REQUEST_CHARS:-100000}
  MAX_TOOL_CALLS: ${MAX_TOOL_CALLS:-8}
  MODEL_VERSION: ${MODEL_VERSION:-runtime-config-v1}
  TOOLSET_VERSION: ${TOOLSET_VERSION:-v2-job-worker-1}
  POLICY_VERSION: ${POLICY_VERSION:-event_aware_cascade_v1}
  READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-3}
  V2_AUTH_TOKENS_JSON: ${V2_AUTH_TOKENS_JSON:?set V2_AUTH_TOKENS_JSON to a secret token-to-subject JSON map}

x-v2-image: &v2-image
  build:
    context: .
    dockerfile: Dockerfile.v2
  image: opinion-agent-v2:${IMAGE_TAG:-dev}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opinion_agent
      POSTGRES_USER: opinion_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opinion_agent -d opinion_agent"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    <<: *v2-image
    command: ["python", "scripts/apply_v2_migrations.py"]
    environment: *runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bootstrap:
    <<: *v2-image
    command: ["python", "scripts/bootstrap_v2_project.py"]
    environment:
      <<: *runtime-environment
      V2_PROJECT_ID: ${V2_PROJECT_ID:-11111111-1111-1111-1111-111111111111}
      V2_PROJECT_NAME: ${V2_PROJECT_NAME:-Local V2 Project}
      V2_PROJECT_CREATED_BY: ${V2_PROJECT_CREATED_BY:?set V2_PROJECT_CREATED_BY to the authenticated bootstrap owner subject}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *v2-image
    environment: *runtime-environment
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *v2-image
    command: ["python", "-m", "arq", "opinion_agent.v2.arq_worker.WorkerSettings"]
    environment:
      <<: *runtime-environment
      WORKER_ID: ${WORKER_ID:-compose-worker-1}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 20s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
